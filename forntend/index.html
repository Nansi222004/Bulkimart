<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#79000B" />
    <meta name="description" content="Bulkimart — Sabse Smart Bulkimart. Smart retail and wholesale shopping." />
    <link rel="icon" type="image/png" href="/src/assets/Glossy%20Aqua%20Bulkimart%20Shopping%20Logo.png" />
    <title>Bulkimart — Sabse Smart Bulkimart</title>
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded without blocking the first paint; text shows in a fallback font until the fonts arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    <!-- The launch screen, drawn the moment the page arrives: the logo with a spinner under it on the
         theme colour. It stays until the app and its storefront content have loaded (see StoreLoading
         in PromotionalSplash.jsx), so no empty header or search bar is ever shown. -->
    <style>
      /* Colours come from the theme this device last showed (see rememberBootLook), else the default. */
      .boot-home{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--boot-header,#79000B);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      /* The logo sits on a white tile so it reads on any theme colour. */
      .boot-logo{display:block;width:104px;height:104px;padding:16px;box-sizing:border-box;border-radius:26px;background:#fff;object-fit:contain;box-shadow:0 12px 32px rgba(0,0,0,.18)}
      /* Mobile-first: hide the circular spinner by default so it never flashes on mobile */
      .boot-spinner{display:none;width:32px;height:32px;box-sizing:border-box;border-radius:50%;border:3px solid rgba(255,255,255,.28);border-top-color:var(--boot-header-text,#fff);animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.boot-spinner{animation-duration:2.4s}}
      /* Desktop website only (screens > 768px): show the loader spinner under the logo */
      @media (min-width: 769px){.boot-home:not(.boot-home--partner) .boot-spinner{display:block}}
      /* The seller, admin and delivery apps: always show spinner on a plain page */
      @media (max-width: 768px){.boot-home:not(.boot-home--partner){display:none !important}}
      .boot-home--partner{background:#fff;display:flex !important}
      .boot-home--partner .boot-logo{display:none}
      .boot-home--partner .boot-spinner{display:block;width:36px;height:36px;border-color:rgba(15,23,42,.1);border-top-color:#0f766e}
      .boot-promotion{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:var(--boot-header,#79000B)}
      @media (min-width:769px){.boot-promotion{display:none}}
    </style>
    <script>
      // Make User, Seller and Delivery apps behave strictly like native mobile apps (no zooming)
      (function() {
        // Prevent iOS Safari pinch-zoom gestures
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

        // Prevent multi-touch pinch to zoom (2+ touch points)
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent Ctrl + wheel zoom (pinch-zoom on trackpads & browser zoom)
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent Ctrl/Cmd + '+', '-', '0' keyboard zoom shortcuts
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot-home" role="status" aria-busy="true" aria-label="Loading Bulkimart"><img class="boot-logo" src="/src/assets/logo-icon-transparent.png" alt="" width="104" height="104"><b class="boot-spinner"></b></div></div>
    <script>
      // The seller, admin and delivery apps are not the shop: they start on a plain page.
      if (/^\/(seller|admin|delivery)(\/|$)/.test(location.pathname)) document.querySelector('.boot-home').classList.add('boot-home--partner');
      else if (window.matchMedia && matchMedia('(max-width: 768px)').matches) { var bootEl = document.querySelector('.boot-home'); if (bootEl) bootEl.style.display = 'none'; }
      // The shop starts in the theme it last showed (same rules as bootLook in utils/storefront.js).
      else try {
        var look = JSON.parse(localStorage.getItem('bulkimart:boot-look')), boot = document.querySelector('.boot-home');
        if (look && (!look.until || Date.parse(look.until) > Date.now())) [['--boot-header', look.header], ['--boot-header-text', look.headerText], ['--boot-background', look.background], ['--boot-search', look.search]]
          .forEach(function (pair) { if (typeof pair[1] === 'string' && /^#[0-9a-f]{3,8}$/i.test(pair[1])) boot.style.setProperty(pair[0], pair[1]); });
      } catch (e) { /* no saved look: default colours */ }
      // Phones only: ask for the storefront (theme and any splash) now, while the app is still
      // downloading, and start fetching the splash image as soon as it is known. The app picks this
      // request up instead of sending its own (takeEarlyExperience in StorefrontContext.jsx).
      (function () {
        var mode = { '/': 'quick', '/grocery--home': 'quick', '/ecommerce--smart-buy': 'shop-all' }[location.pathname];
        if (!mode || !window.matchMedia || !matchMedia('(max-width: 768px)').matches) return;
        var unset = function (v) { return !v || v.charAt(0) === '%'; };
        var base = !unset('%VITE_API_BASE_URL%') ? '%VITE_API_BASE_URL%' : !unset('%VITE_API_URL%') ? '%VITE_API_URL%' : location.origin;
        base = base.replace(/\/$/, '').replace(/\/api$/, '');
        var cacheKey = 'bulkimart:experience:' + mode + ':mobile:';
        var boot = document.querySelector('.boot-home'), preview, previewTimer;
        var fresh = function (data) {
          return data && data.version && Array.isArray(data.banners) && Array.isArray(data.sections) && Date.parse(data.validUntil) > Date.now() && (!data.scheduleUntil || Date.parse(data.scheduleUntil) > Date.now());
        };
        var preload = function (art) {
          if (typeof art !== 'string' || !/^(https?:\/\/|\/(?!\/))/.test(art)) return null;
          var image = new Image(); image.fetchPriority = 'high';
          image.src = art.indexOf('/uploads/') === 0 ? base + art : art;
          return image;
        };
        var prepare = function (data) {
          if (!fresh(data)) return;
          var campaign = data.splash, art = campaign && campaign.banner && (campaign.banner.mobileImage || campaign.banner.image);
          var image = preload(art);
          if (data.banners[0]) preload(data.banners[0].mobileImage || data.banners[0].image);
          // Only a plain home launch gets a boot preview. React owns navigation,
          // frequency consumption, video, countdown and dismissal after handoff.
          if (!boot || !boot.isConnected || location.search || location.hash) return;
          clearTimeout(previewTimer);
          if (preview) { preview.remove(); preview = null; }
          if (!image || !campaign.config || (campaign.startAt && Date.parse(campaign.startAt) > Date.now()) || (campaign.endAt && Date.parse(campaign.endAt) <= Date.now())) return;
          var frequency = campaign.config.frequency, seenKey = 'bulkimart:splash:' + campaign.id + ':' + campaign.revision;
          if (frequency === 'daily') seenKey += ':' + new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(Date.now());
          try { if (frequency !== 'launch' && window[frequency === 'session' ? 'sessionStorage' : 'localStorage'].getItem(seenKey)) return; } catch (e) { /* optional storage */ }
          image.className = 'boot-promotion'; image.alt = campaign.banner.title || 'Bulkimart promotion';
          boot.parentNode.appendChild(image); preview = image;
          previewTimer = setTimeout(function () { image.remove(); }, Math.max(0, Math.min(Date.parse(data.validUntil), Date.parse(data.scheduleUntil) || Infinity, Date.parse(campaign.endAt) || Infinity) - Date.now()));
        };
        for (var i = 0; i < 2; i++) {
          try { var cached = JSON.parse(window[i === 0 ? 'sessionStorage' : 'localStorage'].getItem(cacheKey)); if (fresh(cached)) { prepare(cached); break; } } catch (e) { /* optional cache */ }
        }
        if (!window.fetch) return;
        var promise = fetch(base + '/api/storefront/experience?scope=' + mode + '&device=mobile&category=', { priority: 'high' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (body) {
            if (body && fresh(body.data)) {
              for (var i = 0; i < 2; i++) { try { window[i === 0 ? 'sessionStorage' : 'localStorage'].setItem(cacheKey, JSON.stringify(body.data)); } catch (e) { /* optional cache */ } }
              prepare(body.data);
            }
            return body;
          })
          .catch(function () { return null; });
        window.__bulkimartEarlyExperience = { key: mode + ':mobile:', promise: promise };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
